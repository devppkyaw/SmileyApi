<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — SmilrHQ</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<header class="hero" style="padding-bottom:40px">
  <nav class="nav">
    <a href="/" class="nav-logo" style="text-decoration:none">Smilr<span class="accent">HQ</span></a>
    <div class="nav-links">
      <span id="navEmail" style="color:rgba(255,255,255,0.7);font-size:0.9rem"></span>
      <button onclick="logout()" class="nav-link" style="background:none;border:none;cursor:pointer;color:inherit">Sign out</button>
    </div>
  </nav>
  <div class="hero-content" style="padding-top:60px">
    <h1 style="font-size:clamp(1.8rem,4vw,2.5rem)">Your dashboard<br><span class="accent" id="tierBadge"></span></h1>
    <p class="hero-sub" id="welcomeMsg">Loading…</p>
  </div>
</header>

<section class="access">
  <div class="container">

    <div id="authError" style="display:none;text-align:center;padding:40px 0">
      <p style="color:var(--red);margin-bottom:16px">You are not logged in.</p>
      <a href="/login.html" class="btn-primary">Log in →</a>
    </div>

    <div id="dashContent" style="display:none">

      <div id="upgradedBanner" style="display:none;background:#d1fae5;border:1px solid #6ee7b7;border-radius:8px;padding:14px 20px;margin-bottom:24px;color:#065f46;font-weight:500">
        You're now on Pro. Welcome aboard!
      </div>



      <div id="proActions" style="display:none;margin-bottom:24px">
        <button class="btn-secondary" onclick="openPortal()">Manage subscription</button>
        <span id="portalStatus" style="margin-left:12px;font-size:0.85rem;color:var(--text-muted)"></span>
      </div>

      <!-- ── Locations tab ── -->
      <div id="tab-locations" class="tab-panel">

        <div class="add-forms-row">
          <div class="add-form-group">
            <form id="cvrForm" class="add-form-inline">
              <span class="add-label">Add by CVR</span>
              <input type="text" id="cvrInput" placeholder="e.g. 12345678" class="input-sm" required />
              <button type="submit" class="btn-sm-primary">Add by CVR</button>
            </form>
            <div id="cvrFreeNote" style="display:none;font-size:0.78rem;color:var(--text-muted);margin-top:4px">Free plan: 1 CVR limit.</div>
            <div id="cvrStatus" class="status-sm"></div>
          </div>
          <div class="add-form-group">
            <form id="addForm" class="add-form-inline" style="display:none">
              <span class="add-label">Add by Navnelbnr</span>
              <input type="number" id="navnelbnrInput" placeholder="e.g. 123456" class="input-sm" required />
              <button type="submit" class="btn-sm-primary">Add</button>
            </form>
            <div id="navFreeHint" class="add-form-inline" style="display:none">
              <span class="add-label">Add by Navnelbnr <span class="pro-tag">Pro</span></span>
              <span style="font-size:0.8rem;color:var(--text-muted)">Coming soon on Pro.</span>
            </div>
            <div id="addStatus" class="status-sm"></div>
          </div>
        </div>

        <div class="loc-table-header">
          <div style="display:flex;align-items:center;gap:8px">
            <span id="locationCount" style="font-weight:600;font-size:0.95rem">Locations</span>
            <span id="collapseExpandBtns">
              <button onclick="collapseAll()" class="cvr-toggle-btn" title="Collapse all">▶ All</button>
              <button onclick="expandAll()" class="cvr-toggle-btn" title="Expand all">▼ All</button>
            </span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <select id="sortSelect" class="input-sm sort-select" onchange="renderLocations()" title="Sort locations">
              <option value="cvr">Group by CVR</option>
              <option value="score-asc">Score: Worst first</option>
              <option value="score-desc">Score: Best first</option>
            </select>
            <input type="text" id="locSearch" class="search-input" placeholder="Search by name, Navnelbnr or CVR…" oninput="filterTable()" />
          </div>
        </div>

        <div class="loc-table-wrap">
          <table class="loc-table">
            <thead>
              <tr>
                <th>Navnelbnr</th>
                <th>Name / Address</th>
                <th>Score<small style="display:block;font-weight:400;text-transform:none;letter-spacing:0;font-size:0.68rem;color:var(--text-muted)">new → old</small></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="locationList"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</section>

<site-footer></site-footer>

<script src="/components/footer.js"></script>
<script src="/smilr-icons.js"></script>
<script>
let currentTier = 'free';
var locationData = {};

(async function () {
  const res = await fetch('/v1/business/me');
  if (!res.ok) {
    document.getElementById('authError').style.display = 'block';
    return;
  }

  const me = await res.json();
  currentTier = me.tier;

  document.getElementById('navEmail').textContent   = me.email;
  document.getElementById('tierBadge').textContent  = me.tier === 'pro' ? 'Pro account' : 'Free account';
  document.getElementById('welcomeMsg').textContent = 'Welcome back, ' + me.companyName;
  document.getElementById('dashContent').style.display = 'block';

  if (me.tier === 'pro') {
    document.getElementById('proActions').style.display     = 'block';
    document.getElementById('addForm').style.display        = 'flex';
    document.getElementById('navFreeHint').style.display    = 'none';
  } else {
    document.getElementById('addForm').style.display        = 'none';
    document.getElementById('navFreeHint').style.display    = 'flex';
    document.getElementById('cvrFreeNote').style.display    = 'block';
  }

  if (new URLSearchParams(location.search).get('upgraded') === '1') {
    currentTier = 'pro';
    document.getElementById('upgradedBanner').style.display  = 'block';
    document.getElementById('proActions').style.display      = 'block';
    document.getElementById('addForm').style.display          = 'flex';
    document.getElementById('navFreeHint').style.display      = 'none';
    document.getElementById('cvrFreeNote').style.display      = 'none';
    document.getElementById('tierBadge').textContent         = 'Pro account';
    history.replaceState(null, '', '/dashboard.html');
  }

  loadLocations();
})();

var allLocations = [];

async function loadLocations() {
  const res  = await fetch('/v1/business/locations');
  const data = await res.json();
  allLocations = data.locations;

  document.getElementById('locationCount').textContent = 'Locations (' + data.locationCount + ')';

  locationData = {};
  allLocations.forEach(function (loc) { locationData[loc.navnelbnr] = loc; });

  renderLocations();
}

function locRow(loc, showCvr) {
  var addr = [loc.address, loc.city].filter(Boolean).join(', ');
  return '<tr data-name="' + esc(loc.name || '').toLowerCase() + '" data-navnelbnr="' + loc.navnelbnr + '" data-cvr="' + esc(loc.cvrNumber || '') + '">' +
    '<td class="loc-id">' + loc.navnelbnr + '</td>' +
    '<td>' +
      '<strong style="font-size:0.875rem">' + esc(loc.name) + '</strong>' +
      (addr ? '<span class="loc-addr">' + esc(addr) + '</span>' : '') +
      (showCvr && loc.cvrNumber ? '<span class="loc-cvr">CVR ' + esc(loc.cvrNumber) + '</span>' : '') +
    '</td>' +
    '<td>' + scoreStrip(loc.scoreHistory, loc.virksomhedsType) +
      (loc.inspectionCount > 4
        ? '<a href="javascript:void(0)" class="history-link" onclick="openHistoryModal(' + loc.navnelbnr + ')">View full history (' + loc.inspectionCount + ')</a>'
        : '') +
    '</td>' +
    '<td>' +
      '<div class="act-row">' +
        (loc.reportUrl ? '<a href="' + esc(loc.reportUrl) + '" target="_blank" rel="noopener" class="act-btn" title="View inspection report">&#x1F4CB; Report</a>' : '') +
        '<button onclick="openEmbedModal(' + loc.navnelbnr + ')" class="act-btn" title="Embed code">⎘ Embed</button>' +
        '<button onclick="removeLocation(' + loc.navnelbnr + ')" class="act-btn act-btn--danger" title="Remove">✕</button>' +
      '</div>' +
    '</td>' +
  '</tr>';
}

function groupHeader(cvr, count, showRemove) {
  var label  = '<span class="cvr-group-label">CVR <strong>' + esc(cvr || '—') + '</strong> · ' + count + ' location' + (count !== 1 ? 's' : '') + '</span>';
  var toggle = '<button onclick="toggleGroup(\'' + esc(cvr) + '\')" class="cvr-toggle-btn" title="Collapse/expand">▼</button>';
  var left   = '<div style="display:flex;align-items:center;gap:6px">' + toggle + label + '</div>';
  var btn    = showRemove
    ? '<button onclick="removeByCvr(\'' + esc(cvr) + '\')" class="act-btn act-btn--danger" style="font-size:0.78rem">Remove CVR ✕</button>'
    : '';
  return '<tr class="cvr-group-header" data-group-cvr="' + esc(cvr) + '" data-collapsed="false"><td colspan="4"><div class="cvr-group-inner">' + left + btn + '</div></td></tr>';
}

function renderLocations() {
  var tbody         = document.getElementById('locationList');
  var sortMode      = document.getElementById('sortSelect').value;
  var collapseBtns  = document.getElementById('collapseExpandBtns');

  if (!allLocations.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:28px;color:var(--text-muted);font-size:0.9rem">No locations yet. Add one above.</td></tr>';
    if (collapseBtns) collapseBtns.style.display = 'none';
    return;
  }

  var html = '';

  if (sortMode === 'score-asc' || sortMode === 'score-desc') {
    if (collapseBtns) collapseBtns.style.display = 'none';
    var sorted = allLocations.slice().sort(function (a, b) {
      var aNull = a.latestScore == null, bNull = b.latestScore == null;
      if (aNull && bNull) return 0;
      if (aNull) return 1;
      if (bNull) return -1;
      return sortMode === 'score-asc' ? a.latestScore - b.latestScore : b.latestScore - a.latestScore;
    });
    html = sorted.map(function (loc) { return locRow(loc, true); }).join('');
  } else {
    if (collapseBtns) collapseBtns.style.display = '';
    var groups = {};
    var noCvr  = [];
    allLocations.forEach(function (loc) {
      var key = loc.cvrNumber || '';
      if (!key) { noCvr.push(loc); return; }
      if (!groups[key]) groups[key] = [];
      groups[key].push(loc);
    });
    Object.keys(groups).sort().forEach(function (cvr) {
      var locs = groups[cvr];
      html += groupHeader(cvr, locs.length, true);
      html += locs.map(function (loc) { return locRow(loc, false); }).join('');
    });
    if (noCvr.length) {
      html += groupHeader('', noCvr.length, false);
      html += noCvr.map(function (loc) { return locRow(loc, false); }).join('');
    }
  }

  tbody.innerHTML = html;
  filterTable();
}

function scoreStrip(history, virksomhedsType) {
  var cells = '';
  for (var i = 0; i < 4; i++) {
    if (history && i < history.length) {
      var item = history[i];
      var icon = smilrIcon(virksomhedsType, item.score, 32);
      var title = 'Score ' + item.score + (item.date ? ', ' + formatDate(item.date) : '');
      cells += '<img src="' + icon.src + '" alt="' + icon.alt + '" class="score-thumb" title="' + title + '" />';
    } else if (i === 0 && (!history || history.length === 0)) {
      var icon = smilrIcon(virksomhedsType, null, 32);
      cells += '<img src="' + icon.src + '" alt="' + icon.alt + '" class="score-thumb" title="' + icon.alt + '" />';
    } else {
      cells += '<span class="score-dash">—</span>';
    }
  }
  return '<div class="score-strip">' + cells + '</div>';
}

function formatDate(iso) {
  var p = String(iso).split('-');
  return p[2] + '/' + p[1] + '/' + p[0].slice(2);
}

function collapseAll() {
  document.querySelectorAll('#locationList tr.cvr-group-header').forEach(function (h) {
    h.dataset.collapsed = 'true';
    var btn = h.querySelector('.cvr-toggle-btn');
    if (btn) btn.textContent = '▶';
  });
  document.querySelectorAll('#locationList tr[data-name]').forEach(function (r) {
    r.dataset.groupCollapsed = 'true';
  });
  filterTable();
}

function expandAll() {
  document.querySelectorAll('#locationList tr.cvr-group-header').forEach(function (h) {
    h.dataset.collapsed = 'false';
    var btn = h.querySelector('.cvr-toggle-btn');
    if (btn) btn.textContent = '▼';
  });
  document.querySelectorAll('#locationList tr[data-name]').forEach(function (r) {
    r.dataset.groupCollapsed = 'false';
  });
  filterTable();
}

function toggleGroup(cvr) {
  var header;
  document.querySelectorAll('#locationList tr.cvr-group-header').forEach(function (h) {
    if (h.dataset.groupCvr === cvr) header = h;
  });
  if (!header) return;
  var collapsing = header.dataset.collapsed !== 'true';
  header.dataset.collapsed = collapsing ? 'true' : 'false';
  header.querySelector('.cvr-toggle-btn').textContent = collapsing ? '▶' : '▼';
  document.querySelectorAll('#locationList tr[data-name]').forEach(function (r) {
    if (r.dataset.cvr === cvr) r.dataset.groupCollapsed = collapsing ? 'true' : 'false';
  });
  filterTable();
}

function filterTable() {
  var q    = document.getElementById('locSearch').value.toLowerCase();
  var rows = document.querySelectorAll('#locationList tr[data-name]');
  var noRes = document.getElementById('noResultsRow');
  if (noRes) noRes.remove();
  var visible = 0;
  rows.forEach(function (row) {
    var match = !q ||
      row.dataset.name.includes(q) ||
      String(row.dataset.navnelbnr).includes(q) ||
      (row.dataset.cvr || '').toLowerCase().includes(q);
    var collapsed = !q && row.dataset.groupCollapsed === 'true';
    row.style.display = (match && !collapsed) ? '' : 'none';
    if (match && !collapsed) visible++;
  });
  document.querySelectorAll('#locationList .cvr-group-header').forEach(function (header) {
    var cvr = header.dataset.groupCvr;
    var groupRows = document.querySelectorAll('#locationList tr[data-cvr="' + cvr + '"]');
    var anyVisible = Array.from(groupRows).some(function (r) { return r.style.display !== 'none'; });
    var intentionallyCollapsed = header.dataset.collapsed === 'true';
    header.style.display = (anyVisible || intentionallyCollapsed) ? '' : 'none';
  });
  if (visible === 0 && rows.length > 0) {
    var tr = document.createElement('tr');
    tr.id = 'noResultsRow';
    tr.innerHTML = '<td colspan="4" style="text-align:center;padding:24px;color:var(--text-muted);font-size:0.9rem">No locations match your search.</td>';
    document.getElementById('locationList').appendChild(tr);
  }
}

document.getElementById('addForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const navnelbnr = parseInt(document.getElementById('navnelbnrInput').value);
  const status    = document.getElementById('addStatus');
  status.style.color = 'inherit';
  status.textContent = 'Adding…';
  const res  = await fetch('/v1/business/locations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ navnelbnr })
  });
  const data = await res.json();
  if (res.ok) {
    status.style.color = 'var(--green)';
    status.textContent = 'Added.';
    document.getElementById('navnelbnrInput').value = '';
    loadLocations();
  } else {
    status.style.color = 'var(--red)';
    status.textContent = data.error?.message || 'Failed.';
  }
});

document.getElementById('cvrForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const cvr    = document.getElementById('cvrInput').value.trim();
  const status = document.getElementById('cvrStatus');
  status.style.color = 'inherit';
  status.textContent = 'Adding…';
  const res  = await fetch('/v1/business/locations/by-cvr', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cvr })
  });
  const data = await res.json();
  if (res.ok) {
    status.style.color = 'var(--green)';
    status.textContent = 'Added ' + data.added + ' location' + (data.added !== 1 ? 's' : '') + ' (' + data.total + ' total for this CVR).';
    document.getElementById('cvrInput').value = '';
    loadLocations();
  } else {
    status.style.color = 'var(--red)';
    status.textContent = data.error?.message || 'Failed.';
  }
});

async function removeLocation(navnelbnr) {
  if (!confirm('Remove this location?')) return;
  await fetch('/v1/business/locations/' + navnelbnr, { method: 'DELETE' });
  loadLocations();
}

async function removeByCvr(cvr) {
  if (!confirm('Remove all locations for CVR ' + cvr + '?')) return;
  await fetch('/v1/business/locations/by-cvr', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cvr })
  });
  loadLocations();
}

async function openPortal() {
  const status = document.getElementById('portalStatus');
  status.textContent = 'Opening…';
  try {
    const res  = await fetch('/v1/business/portal', { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
      status.textContent = '';
      location.href = data.url;
    } else {
      status.textContent = data.error?.message || 'Failed to open portal.';
    }
  } catch {
    status.textContent = 'Network error.';
  }
}

async function logout() {
  await fetch('/v1/business/logout', { method: 'POST' });
  location.href = '/';
}

function openEmbedModal(navnelbnr) {
  var loc = locationData[navnelbnr];
  document.getElementById('modalTitle').textContent = loc.name;

  var icon    = smilrIcon(loc.virksomhedsType, loc.latestScore, 150);
  var dateStr = loc.latestScoreDate ? formatDate(loc.latestScoreDate) : '';
  document.getElementById('modalPreview').innerHTML =
    '<div class="static-badge" style="display:inline-block;text-align:center">' +
      '<img src="' + icon.src + '" alt="' + icon.alt +
        '" style="width:64px;height:64px;object-fit:contain;display:block;mix-blend-mode:multiply" />' +
      (dateStr ? '<div class="static-badge-date">' + dateStr + '</div>' : '') +
    '</div>';

  document.getElementById('modalCode').textContent =
    '<script src="' + location.origin + '/widget.js" data-navnelbnr="' + navnelbnr + '"><\/script>';
  document.getElementById('modalCopyBtn').textContent = 'Copy ⎘';
  document.getElementById('embedModal').style.display = 'flex';
}

function closeEmbedModal() {
  document.getElementById('embedModal').style.display = 'none';
}

async function openHistoryModal(navnelbnr) {
  var loc = locationData[navnelbnr];
  document.getElementById('historyModalTitle').textContent = loc.name;
  var body = document.getElementById('historyModalBody');
  body.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem">Loading…</p>';
  document.getElementById('historyModal').style.display = 'flex';

  var res = await fetch('/v1/business/locations/' + navnelbnr + '/history');
  if (!res.ok) {
    body.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem">Could not load history.</p>';
    return;
  }
  var data = await res.json();
  if (!data.history.length) {
    body.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem">No inspection history yet.</p>';
    return;
  }
  var rows = data.history.map(function (item) {
    var icon = smilrIcon(loc.virksomhedsType, item.score, 28);
    return '<tr>' +
      '<td><img src="' + icon.src + '" alt="' + icon.alt + '" class="score-thumb" /></td>' +
      '<td>' + item.score + '</td>' +
      '<td>' + formatDate(item.date) + '</td>' +
    '</tr>';
  }).join('');
  body.innerHTML =
    '<table class="history-table">' +
      '<thead><tr><th></th><th>Score</th><th>Date</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
}

function closeHistoryModal() {
  document.getElementById('historyModal').style.display = 'none';
}

function copyModalCode() {
  var code = document.getElementById('modalCode').textContent;
  navigator.clipboard.writeText(code).then(function () {
    var btn = document.getElementById('modalCopyBtn');
    btn.textContent = 'Copied ✓';
    setTimeout(function () { btn.textContent = 'Copy ⎘'; }, 2000);
  });
}

function esc(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('embedModal').addEventListener('click', function (e) {
    if (e.target === this) closeEmbedModal();
  });

  document.getElementById('historyModal').addEventListener('click', function (e) {
    if (e.target === this) closeHistoryModal();
  });
});

window.addEventListener('pageshow', function () {
  document.getElementById('portalStatus').textContent   = '';
});
</script>

<div id="embedModal" class="modal-overlay" style="display:none">
  <div class="modal-dialog">
    <div class="modal-header">
      <span id="modalTitle" style="font-weight:600;font-size:1rem"></span>
      <button class="modal-close" onclick="closeEmbedModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-cols">
        <div class="modal-col">
          <div class="modal-col-label">Preview</div>
          <div id="modalPreview"></div>
        </div>
        <div class="modal-col">
          <div class="modal-col-label">Embed code</div>
          <pre id="modalCode" class="modal-code"></pre>
          <button id="modalCopyBtn" onclick="copyModalCode()" class="btn-sm-primary" style="margin-top:10px">Copy ⎘</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="historyModal" class="modal-overlay" style="display:none">
  <div class="modal-dialog">
    <div class="modal-header">
      <span id="historyModalTitle" style="font-weight:600;font-size:1rem"></span>
      <button class="modal-close" onclick="closeHistoryModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="historyModalBody"></div>
    </div>
  </div>
</div>

</body>
</html>
